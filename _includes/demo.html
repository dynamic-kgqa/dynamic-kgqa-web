<head>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/demo.css' | relative_url }}">
    <link rel="shortcut icon" type="image/png" href="{{ '/assets/favicon.ico' | relative_url }}">
</head>

<body>
    <div class="hero">
    <h1>Dynamic-KGQA Demo</h1>
    <div class="button-group">
        <p>Explore Subgraphs and Question-Answer pairs generated by Dynamic-KGQA.</p>
        <!-- <a href="/dynamic-kgqa-web/demo" class="btn">Live Demo</a> -->
        <a href="/dynamic-kgqa-web/" class="btn">Home</a>
    </div>
    </div>

    <div class="container">
        <section class="header-content">
            <h2>Explore Subgraphs</h2>
            <p>Interact and Explore various Subgraphs.</p>
        </section>

        <div class="content-grid">
        {% for graph in site.data.graphs.graphs %}
        <div>
            {{ forloop.index }}. <strong>{{ graph.id }}</strong>
        </div>
        {% endfor %}
        </div>
    </div>
</body>
