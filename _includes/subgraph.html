<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knowledge Graph Visualization (Cytoscape.js)</title>
  <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
  <style>
    #cy { width: 1000px; height: 650px; display: block; margin: 0 auto; background: #e5ecf6; border-radius: 8px; }
    #datapoint-panel { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; margin-left: 0; margin-top: 0; height: 650px; justify-content: flex-start; }
    .datapoint-btn { width: 32px; height: 32px; background: #E74C3C; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.15); border: 2px solid #222; }
    #datapoint-tooltip { display:none; position:absolute; z-index:2000; background:#fff; border:1px solid #ccc; border-radius:8px; padding:12px; box-shadow:0 2px 8px rgba(0,0,0,0.15); font-size:15px; max-width:350px; }
  </style>
</head>
<body>
  <div style="display: flex; flex-direction: row; justify-content: center; align-items: flex-start; width: 100vw; min-height: 90vh; gap: 18px;">
    <div id="qa-panel" style="width: 300px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 22px 18px 18px 18px; font-size: 17px; color: #222; font-family: 'Segoe UI', 'Arial', sans-serif; display: flex; flex-direction: column; gap: 18px; align-items: flex-start; align-self: flex-start; min-width: 220px; max-width: 340px; height: 480px; overflow-y: auto;">
      <div id="qa-content" style="white-space: pre-line;"></div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-start;">
      <div style="display: flex; flex-direction: row; align-items: flex-start; gap: 0;">
        <div id="cy" style="width: 1000px; height: 650px; display: block; background: #e5ecf6; border-radius: 10px;"></div>
        <div id="datapoint-panel"></div>
      </div>
      <div id="llm-judges-row" style="width: 1012px; display: flex; flex-direction: row; justify-content: space-between; gap: 18px; margin-top: 10px;">
        <div class="llm-judge-box" id="llm-judge-1" style="flex: 1 1 0; min-width: 0; background: #f7fafd; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); padding: 18px 14px 18px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 180px; max-height: 650px; font-size: 15px;"></div>
        <div class="llm-judge-box" id="llm-judge-2" style="flex: 1 1 0; min-width: 0; background: #f7fafd; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); padding: 18px 14px 18px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 180px; max-height: 650px; font-size: 15px;"></div>
        <div class="llm-judge-box" id="llm-judge-3" style="flex: 1 1 0; min-width: 0; background: #f7fafd; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); padding: 18px 14px 18px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 180px; max-height: 650px; font-size: 15px;"></div>
      </div>
    </div>
  </div>
  <script>
    // Inline graph data
    const graphData = {"nodes": [{"id": "n0", "label": "\u00c1d\u00e1m Bogd\u00e1n"}, {"id": "n1", "label": "Bolton Wanderers F.C."}, {"id": "n2", "label": "Wigan Athletic F.C."}, {"id": "n3", "label": "Gary Cahill"}, {"id": "n4", "label": "English Football League"}, {"id": "n5", "label": "Aston Villa F.C."}, {"id": "n6", "label": "Steve Fulton"}, {"id": "n7", "label": "Celtic F.C."}, {"id": "n8", "label": "Partick Thistle F.C."}, {"id": "n9", "label": "Peterborough United F.C."}, {"id": "n10", "label": "Jay Fulton"}, {"id": "n11", "label": "Swansea City A.F.C."}], "edges": [{"id": "e0", "source": "n0", "target": "n1", "label": "memberOf"}, {"id": "e1", "source": "n0", "target": "n2", "label": "memberOf"}, {"id": "e2", "source": "n3", "target": "n4", "label": "playsIn"}, {"id": "e3", "source": "n3", "target": "n1", "label": "memberOf"}, {"id": "e4", "source": "n3", "target": "n5", "label": "memberOf"}, {"id": "e5", "source": "n6", "target": "n7", "label": "memberOf"}, {"id": "e6", "source": "n6", "target": "n8", "label": "memberOf"}, {"id": "e7", "source": "n6", "target": "n1", "label": "memberOf"}, {"id": "e8", "source": "n6", "target": "n9", "label": "memberOf"}, {"id": "e9", "source": "n10", "target": "n2", "label": "memberOf"}, {"id": "e10", "source": "n10", "target": "n11", "label": "memberOf"}], "datapoints": [{"question": "Which football club connects \u00c1d\u00e1m Bogd\u00e1n and Steve Fulton in their career history?", "answer": "Bolton Wanderers F.C.", "supporting_facts": [{"subject": "\u00c1d\u00e1m_Bogd\u00e1n", "predicate": "memberOf", "object": "Bolton_Wanderers_F_u002E_C_u002E_"}, {"subject": "Steve_Fulton", "predicate": "memberOf", "object": "Bolton_Wanderers_F_u002E_C_u002E_"}], "supporting_fact_edge_ids": ["e0", "e7"], "llm_judges": [{"logical_structure_flag": true, "logical_structure_reasoning": "The question is grammatically and syntactically correct.", "redundancy_flag": false, "redundancy_reasoning": "The question does not contain any explicit heir career history?", "answer": "Wigan Athletic F.C.", "supporting_facts": [{"subject": "Jay_Fulton", "predicate": "memberOf", "object": "Wigan_Athletic_F_u002E_C_u002E_"}, {"subject": "\u00c1d\u00e1m_Bogd\u00e1n", "predicate": "memberOf", "object": "Wigan_Athletic_F_u002E_C_u002E_"}], "supporting_fact_edge_ids": ["e9", "e1"], "llm_judges": [{"logical_structure_flag": true, "logical_structure_reasoning": "The question is grammatically and syntactically correct.", "redundancy_flag": false, "redundancy_reasoning": "The question does not contain any explicit answers or obvious phrasing that might lead to confusion.", "answer_support_flag": true, "answer_support_reasoning": "Both Jay Fulton and \u00c1d\u00e1m Bogd\u00e1n have a career history triple featuring 'Wigan_Athletic_F_u002E_C_u002E_'", "answer_adequacy_flag": true, "answer_adequacy_reasoning": "The answer sufficiently clarifies the connection between Jay Fulton and \u00c1d\u00e1m Bogd\u00e1n, stating the football club that they both have been members of."}, {"logical_structure_flag": true, "logical_structure_reasoning": "The grammar and syntax are correct.", "redundancy_flag": false, "redundancy_reasoning": "The question does not contain its own answer explicitly or through overly obvious phrasing.", "answer_support_flag": true, "answer_support_reasoning": "Both Jay Fulton and \u00c1d\u00e1m Bogd\u00e1n are members of Wigan Athletic F.C., as indicated by the supporting facts.", "answer_adequacy_flag": true, "answer_adequacy_reasoning": "The answer directly and fully addresses the question by providing the football club that connects Jay Fulton and \u00c1d\u00e1m Bogd\u00e1n in their career history."}, {"logical_structure_flag": true, "logical_structure_reasoning": "The grammar and syntax of the question are correct.", "redundancy_flag": false, "redundancy_reasoning": "The question does not contain its own answer explicitly or through overly obvious phrasing.", "answer_support_flag": true, "answer_support_reasoning": "The answer 'Wigan Athletic F.C.' is explicitly supported by the provided facts. Both Jay Fulton and \u00c1d\u00e1m Bogd\u00e1n are listed as members of Wigan Athletic F.C., which directly connects them in their career history.", "answer_adequacy_flag": true, "answer_adequacy_reasoning": "The answer 'Wigan Athletic F.C.' fully and clearly addresses the question. It directly states the football club that connects Jay Fulton and \u00c1d\u00e1m Bogd\u00e1n in their career history."}]}]};
    const cy = cytoscape({
      container: document.getElementById('cy'),
      elements: [
        ...graphData.nodes.map(n => ({ data: n })),
        ...graphData.edges.map(e => ({ data: e }) )
      ],
      style: [
        { selector: 'node', style: { 'background-color': '#3498DB', 'label': 'data(label)', 'text-valign': 'bottom', 'text-halign': 'center', 'color': '#222', 'font-size': 14, 'width': 30, 'height': 30, 'border-width': 2, 'border-color': '#222' } },
        { selector: 'edge', style: { 'width': 2, 'line-color': '#888', 'target-arrow-color': '#888', 'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'label': 'data(label)', 'font-size': 12, 'color': '#222' } },
        { selector: 'edge.highlighted', style: { 'line-color': '#FF4136', 'target-arrow-color': '#FF4136', 'width': 4 } },
      ],
      layout: {
        name: 'cose',
        animate: false,
        nodeRepulsion: 12000,
        idealEdgeLength: 200,
        nodeDimensionsIncludeLabels: true,
        padding: 50
      }
    });
    // Datapoint panel
    const panel = document.getElementById('datapoint-panel');
    const qaContent = document.getElementById('qa-content');
    const judgeBoxes = [
      document.getElementById('llm-judge-1'),
      document.getElementById('llm-judge-2'),
      document.getElementById('llm-judge-3')
    ];
    function renderQA(dp) {
      qaContent.innerHTML = `
        <div style="font-weight: 700; font-size: 22px; margin-bottom: 18px; color: #2d3a4a;">Question</div>
        <div style="margin-bottom: 32px; line-height: 1.5;">${dp.question}</div>
        <div style="font-weight: 700; font-size: 21px; margin-bottom: 14px; color: #2d3a4a;">Answer</div>
        <div style="margin-bottom: 8px; font-size: 22px; color: #1a5c2e; font-weight: 600;">${dp.answer}</div>
      `;
      // Render LLM judge boxes
      (dp.llm_judges || []).forEach((judge, idx) => {
        judgeBoxes[idx].innerHTML = `
          <div style="font-weight: 700; font-size: 17px; margin-bottom: 8px; color: #2d3a4a;">LLM Judge ${idx+1}</div>
          <div style="margin-bottom: 6px;"><b>Logical Structure:</b> <span style="color: #1a5c2e; font-weight: 600;">${judge.logical_structure_flag ?? '—'}</span></div>
          <div style="font-size: 15px; color: #444; margin-bottom: 10px;">${judge.logical_structure_reasoning ?? '—'}</div>
          <div style="margin-bottom: 6px;"><b>Redundancy:</b> <span style="color: #1a5c2e; font-weight: 600;">${judge.redundancy_flag ?? '—'}</span></div>
          <div style="font-size: 15px; color: #444; margin-bottom: 10px;">${judge.redundancy_reasoning ?? '—'}</div>
          <div style="margin-bottom: 6px;"><b>Answer Support:</b> <span style="color: #1a5c2e; font-weight: 600;">${judge.answer_support_flag ?? '—'}</span></div>
          <div style="font-size: 15px; color: #444; margin-bottom: 10px;">${judge.answer_support_reasoning ?? '—'}</div>
          <div style="margin-bottom: 6px;"><b>Answer Adequacy:</b> <span style="color: #1a5c2e; font-weight: 600;">${judge.answer_adequacy_flag ?? '—'}</span></div>
          <div style="font-size: 15px; color: #444;">${judge.answer_adequacy_reasoning ?? '—'}</div>
        `;
      });
      // Fill empty boxes if any
      for (let i = (dp.llm_judges || []).length; i < 3; ++i) {
        judgeBoxes[i].innerHTML = `<div style="font-weight: 700; font-size: 17px; margin-bottom: 8px; color: #2d3a4a;">LLM Judge ${i+1}</div><div style="color: #bbb; font-size: 15px;">No data</div>`;
      }
    }
    function clearJudges() {
      judgeBoxes.forEach((box, idx) => {
        box.innerHTML = `<div style="font-weight: 700; font-size: 17px; margin-bottom: 8px; color: #2d3a4a;">LLM Judge ${idx+1}</div><div style="color: #bbb; font-size: 15px;">No data</div>`;
      });
    }
    graphData.datapoints.forEach((dp, idx) => {
      const btn = document.createElement('div');
      btn.className = 'datapoint-btn';
      btn.title = 'Show Q/A';
      btn.addEventListener('mouseenter', function(e) {
        // Highlight edges
        cy.edges().removeClass('highlighted');
        dp.supporting_fact_edge_ids.forEach(eid => {
          const edge = cy.getElementById(eid);
          if (edge) edge.addClass('highlighted');
        });
        renderQA(dp);
      });
      btn.addEventListener('mouseleave', function(e) {
        cy.edges().removeClass('highlighted');
        qaContent.innerHTML = `<span style='color: #888;'>Hover over a datapoint to see the question and answer.</span>`;
        clearJudges();
      });
      btn.addEventListener('click', function(e) {
        // On click, keep the Q/A visible until another is clicked or hovered
        renderQA(dp);
      });
      panel.appendChild(btn);
    });
    // On load, clear judges
    clearJudges();
  </script>
</body>
